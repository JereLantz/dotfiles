$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$rssReader = flatpak run io.gitlab.news_flash.NewsFlash

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Close hyprland
bind = $mainMod SHIFT ctrl, F12, exit,

# reload waybar
bind = $mainMod ctrl, 0, exec, killall waybar && waybar

# Lock the screen
bind = $mainMod shift, F12, exec, hyprlock

############
### Apps ###
bind = $mainMod, return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, z, exec, flatpak run app.zen_browser.zen
bind = $mainMod, d, exec, com.discordapp.Discord
bind = $mainMod, r, exec, $rssReader
# 14.4.2026 piti lisätä toi parametri spotifylle, koska se vissiin yritti käyttää väärää audio hommaa, eikä onnistunu soittamaan enää musiikkia
bind = $mainMod, s, exec, spotify --audio-api=pulseaudio
bind = $mainMod, a, exec, anki
bind = $mainMod, f, exec, flatpak run one.ablaze.floorp
# Tää on joku hack jolla saa resoluution scaleemisen toimimaa
# https://www.reddit.com/r/hyprland/comments/19crkzq/solved_microsoft_edge_blurry_displayscaling_issue/
bind = $mainMod, b, exec, brave --ozone-platform=wayland "$@"

# Keys for screenshotting with hyprshot
bind = , PRINT, exec, hyprshot -m window
bind = SHIFT , PRINT, exec, hyprshot -m region

#########################
### Window management ###
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows on the screen
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster master

# Change the master window size
bind = $mainMod, P, layoutmsg, mfact +0.02
bind = $mainMod, N, layoutmsg, mfact -0.02

# toggle window floating
bind = $mainMod shift, F, togglefloating, 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# -silent means that the focus doesn't follow the window that was moves
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# default workspacet pöytäkoneen pää näytölle
workspace = 1, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980, default:true
workspace = 2, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980
workspace = 3, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980
workspace = 4, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980
workspace = 5, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980
workspace = 6, monitor:desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980

# default workspacet pöytäkoneen tokalle näytölle
workspace = 7, monitor:desc:BNQ ZOWIE XL LCD 28G00592SL0, default:true
workspace = 8, monitor:desc:BNQ ZOWIE XL LCD 28G00592SL0
workspace = 9, monitor:desc:BNQ ZOWIE XL LCD 28G00592SL0
workspace = 10, monitor:desc:BNQ ZOWIE XL LCD 28G00592SL0
