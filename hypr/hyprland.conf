source = ~/.config/hypr/bindings.conf

################
### MONITORS ###
################

# Formatti =
# monitor = name, resolution, position, scale

# Pöytäkoneen näytöt #
monitor= desc:ASUSTek COMPUTER INC XG27UCS S3LMTF148980, 3840x2160@160.00, 0x0,1.5
monitor= desc:BNQ ZOWIE XL LCD 28G00592SL0, 1920x1080@60, -1920x150, 1

# Random näyttöjä varten
monitor = , preferred, auto, 1

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
            range = 4
            render_power = 3
            color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    orientation = left
    new_status = slave
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fi
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    #force_no_accel = true
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    #workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more

# pallohiiri
device{
    name= logitech-usb-receiver-mouse
    accel_profile = adaptive
    sensitivity = 0
}


#################
### AUTOSTART ###
#################

exec-once = waybar & swaync
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = fcitx5

#windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrule {
    name = suppress-maximize-for-all
    suppress_event = maximize
    match:class = .*
}


## Window rules ##
# setting the "save" window promt on browsers to floating by default
windowrule {
    name = browser-save-promt-floating
    float = on
    match:class = xdg-desktop-portal-gtk
}

windowrule {
    name = anki-float
    float = on
    match:class = anki
}

# gnome extract tool
windowrule {
    name = gnome-extract-tool-float
    float = on
    match:class = org.gnome.FileRoller
}

# Thunar rename window
windowrule {
    name = thunar-rename-window-float
    float = on
    match:title = (Rename)(.*)
}

# Runelite
windowrule {
    name = runelite-float
    float = on
    match:initial_title = RuneLite
}

xwayland{
    #force_zero_scaling = true
    use_nearest_neighbor = false
}
